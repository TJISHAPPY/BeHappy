<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — BeHappy</title>
<meta name="description" content="캠페인 문의 letsbehappy@behappycreative.com, 채용 문의 happiz@behappycreative.com. 서울 성동구 아차산로 126, 더리브세종타워 606호.">
<meta name="theme-color" content="#1C1A10">
<meta property="og:title" content="Contact — BeHappy">
<meta property="og:description" content="BeHappy와 함께 행복한 캠페인을 시작하세요.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=Instrument+Sans:wdth,wght@75..100,400..700&family=Noto+Sans+KR:wght@300..700&display=swap">
<link rel="stylesheet" href="assets/site.css">
<style>
.contact-head { padding-top: clamp(24px, 4vw, 56px); }
.ask { border-top: 1px solid var(--line); padding-block: clamp(36px, 5vw, 64px); row-gap: 24px; align-items: end; }
.ask:last-child { border-bottom: 1px solid var(--line); }
.ask .display-kr { grid-column: 1 / span 6; font-size: clamp(1.8rem, 3.6vw, 3.2rem); }
.ask .reach { grid-column: 8 / span 5; }
.reach .small { display: block; margin-bottom: 6px; }
.mail { display: inline-block; font: 500 clamp(1.15rem, 2vw, 1.7rem)/1.3 var(--latin); letter-spacing: -0.02em; text-decoration: none; background: linear-gradient(var(--zing), var(--zing)) 0 88% / 100% 0.36em no-repeat; overflow-wrap: anywhere; }
.mail:hover { background-size: 100% 100%; }
/* 메일 주소: Belife 강조와 같은 노란 형광펜 스타일. 페이지가 열리면 왼쪽부터 칠해진다 */
body.dark .mail { color: #FFFFFF; font-weight: 600; padding: 0.04em 0.22em 0.1em; margin-left: -0.22em; border-radius: 0.18em;
  background: linear-gradient(var(--zing), var(--zing)) no-repeat left center / 0% 100%;
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
  animation: mark 0.8s cubic-bezier(0.65, 0, 0.25, 1) forwards; animation-delay: var(--d, 1s); }
@keyframes mark { to { background-size: 100% 100%; color: var(--ink); } }
body.dark .mail:hover { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 0.18em; }
@media (prefers-reduced-motion: reduce) { body.dark .mail { animation: none; background-size: 100% 100%; color: var(--ink); } }
body.dark .copy:hover { color: #FFFFFF; }
body.dark .where .links a, body.dark .where .links button { color: #FFFFFF; }
.copy { display: block; margin-top: 12px; font: 500 14px/1.6 var(--latin); color: var(--graphite); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.copy:hover { color: var(--ink); }
@media (max-width: 900px) { .ask .display-kr, .ask .reach { grid-column: 1 / -1; } }

.map { position: relative; aspect-ratio: 16 / 7; background: var(--mist); overflow: hidden; }
.map iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; filter: grayscale(1) contrast(1.05) brightness(1.04); }
.map .pin { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; transform: translate(-50%, -100%); z-index: 2; pointer-events: none; }
.map .pin svg { width: 100%; height: 100%; }
.map .pin::after { content: ""; position: absolute; left: 50%; bottom: -10px; width: 2px; height: 12px; background: var(--ink); transform: translateX(-50%); }
.map .grid-bg { position: absolute; inset: 0; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 64px 64px; opacity: 0.6; }
@media (max-width: 760px) { .map { aspect-ratio: 4 / 3; } }
.where { padding-top: 28px; row-gap: 16px; align-items: start; }
.where address { grid-column: 1 / span 6; font-style: normal; }
.where .links { grid-column: 8 / span 5; display: flex; gap: 24px; flex-wrap: wrap; font: 500 15px/1.6 var(--latin); }
.where .links a, .where .links button { color: var(--ink); background: none; border: 0; padding: 0; font: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
@media (max-width: 900px) { .where address, .where .links { grid-column: 1 / -1; } }
/* Work 페이지와 같은 글자 모션: 하나씩 튀어 오르며 등장 → 몇 초마다 파도타기 */
.ask .ch { display: inline-block; white-space: pre; animation: rise 0.7s cubic-bezier(0.2, 1.5, 0.4, 1) both; animation-delay: calc(0.15s + var(--i) * 0.035s); }
@keyframes rise { from { opacity: 0; transform: translateY(0.6em) scale(0.8); } to { opacity: 1; transform: none; } }
.ask .wave .ch { animation: hop 0.55s cubic-bezier(0.3, 0, 0.3, 1) both; animation-delay: calc(var(--i) * 0.04s); }
@keyframes hop { 0%, 100% { transform: none; } 40% { transform: translateY(-0.22em); } 70% { transform: translateY(0.03em); } }
@media (prefers-reduced-motion: reduce) { .ask .ch, .ask .wave .ch { animation: none; } }
</style>
</head>
<body data-page="contact" class="dark">
<main>
  <section class="wrap page-head contact-head">
    <h1 class="sr">Contact</h1>
    <div class="grid ask">
      <h2 class="display-kr">BeHappy와 함께<br>행복한 캠페인을 시작하세요</h2>
      <div class="reach">
        <span class="small">캠페인 문의</span>
        <a class="mail" href="mailto:letsbehappy@behappycreative.com">letsbehappy@behappycreative.com</a>
        <button class="copy" type="button" data-copy="letsbehappy@behappycreative.com">주소 복사</button>
      </div>
    </div>
    <div class="grid ask">
      <h2 class="display-kr">Happiz가 되어<br>일의 행복을 추구하세요</h2>
      <div class="reach">
        <span class="small">채용 문의</span>
        <a class="mail" href="mailto:happiz@behappycreative.com" style="--d:1.5s">happiz@behappycreative.com</a>
        <button class="copy" type="button" data-copy="happiz@behappycreative.com">주소 복사</button>
      </div>
    </div>
  </section>

  <section class="wrap">
    <h2 class="sr">오시는 길</h2>
    <div class="map" id="map">
      <div class="grid-bg" aria-hidden="true"></div>
      <div class="pin" aria-hidden="true"></div>
    </div>
    <div class="grid where">
      <address>
        <p class="title-kr">서울 성동구 아차산로 126, 더리브세종타워 606호</p>
        <p class="small" style="margin:4px 0 0">2호선 성수역 인근</p>
      </address>
      <div class="links">
        <a href="https://map.naver.com/p/search/%EC%84%9C%EC%9A%B8%20%EC%84%B1%EB%8F%99%EA%B5%AC%20%EC%95%84%EC%B0%A8%EC%82%B0%EB%A1%9C%20126" target="_blank" rel="noopener">네이버 지도</a>
        <a href="https://map.kakao.com/?q=%EC%84%9C%EC%9A%B8%20%EC%84%B1%EB%8F%99%EA%B5%AC%20%EC%95%84%EC%B0%A8%EC%82%B0%EB%A1%9C%20126" target="_blank" rel="noopener">카카오맵</a>
        <button type="button" data-copy="서울 성동구 아차산로 126, 더리브세종타워 606호">주소 복사</button>
      </div>
    </div>
  </section>
</main>
<script src="assets/site.js"></script>
<script>
(function () {
  var heads = [].slice.call(document.querySelectorAll('.ask .display-kr'));
  heads.forEach(function (h, k) {
    var lines = h.innerHTML.split(/<br\s*\/?>/i), n = k * 12;
    h.setAttribute('aria-label', lines.join(' ').replace(/\s+/g, ' ').trim());
    h.innerHTML = lines.map(function (line) {
      return line.split('').map(function (c) { return '<span class="ch" aria-hidden="true" style="--i:' + (n++) + '">' + c + '</span>'; }).join('');
    }).join('<br>');
  });
  var reduce = false;
  try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
  if (reduce) { return; }
  /* 두 문장이 번갈아 출렁인다 */
  heads.forEach(function (h, k) {
    setTimeout(function () {
      setInterval(function () { h.classList.remove('wave'); void h.offsetWidth; h.classList.add('wave'); }, 5000);
    }, 2000 + k * 2500);
  });
})();
(function () {
  var map = document.getElementById('map'), pin = map.querySelector('.pin');
  pin.innerHTML = window.BEHAPPY.faceSVG();
  /* 실제 도메인에서만 구글 지도를 불러온다. 미리보기에서는 핀과 격자만 보인다 */
  if (/behappycreative\.com$|github\.io$/.test(location.hostname)) {
    var f = document.createElement('iframe');
    f.title = 'BeHappy 사무실 위치';
    f.loading = 'lazy';
    f.src = 'https://www.google.com/maps?q=' + encodeURIComponent('서울 성동구 아차산로 126') + '&z=16&output=embed';
    map.insertBefore(f, map.firstChild);
    map.querySelector('.grid-bg').remove();
    pin.remove();
  }
})();
</script>
</body>
</html>
