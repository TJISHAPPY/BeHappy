<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happiz — BeHappy</title>
<meta name="description" content="일로부터의 행복을 추구하는 사람들, Happiz. 행복하게 일하며 행복한 결과를 만들어내는 BeHappy의 사람들을 소개합니다.">
<meta name="theme-color" content="#1C1A10">
<meta property="og:title" content="Happiz — BeHappy">
<meta property="og:description" content="일로부터의 행복을 추구하는 사람들, Happiz.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=Instrument+Sans:wdth,wght@75..100,400..700&family=Noto+Sans+KR:wght@300..700&display=swap">
<link rel="stylesheet" href="assets/site.css">
<style>
.mission { text-align: center; padding-top: clamp(64px, 11vw, 150px); }
.mission .display-kr { grid-column: 2 / span 10; font-size: clamp(1.9rem, 4vw, 3.6rem); }
.mission .lead { grid-column: 3 / span 8; margin-top: 28px; color: var(--graphite); }
@media (max-width: 900px) { .mission .display-kr, .mission .lead { grid-column: 1 / -1; } }
.people { list-style: none; margin: 0; padding: 0; row-gap: 48px; }
.person { grid-column: span 3; }
/* 3D 캐릭터 이미지의 배경색과 같은 색으로 카드를 채워 경계가 보이지 않게 한다 */
.portrait { aspect-ratio: 4 / 5; background: #1C1303; display: grid; place-items: center; overflow: hidden; }
.portrait img { width: 135%; max-width: none; height: auto; }
.person h3 { margin: 20px 0 2px; font: 600 1.75rem/1.1 var(--latin); font-variation-settings: "wdth" 85; letter-spacing: -0.03em; }
.person p { margin: 0; font: 400 15px/1.5 var(--latin); color: var(--graphite); }
@media (max-width: 1000px) { .person { grid-column: span 6; } }
@media (max-width: 560px) { .person { grid-column: 1 / -1; } }
/* 해피즈 다섯 얼굴: 차례로 튀어 올라 등장 → 둥실 떠 있다가 → 고개를 돌려 옆 사람을 살핀다 */
.faces { list-style: none; margin: clamp(48px, 7vw, 96px) 0 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: clamp(4px, 1vw, 16px); }
.hz { perspective: 700px; animation: hzIn 0.8s cubic-bezier(0.25, 1.5, 0.45, 1) both; animation-delay: calc(0.2s + var(--n) * 0.12s); }
@keyframes hzIn { from { opacity: 0; transform: translateY(40%) scale(0.6); } to { opacity: 1; transform: none; } }
.hz .fl { animation: hzFloat 4.2s ease-in-out infinite; animation-delay: calc(var(--n) * -0.9s); }
@keyframes hzFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4%); } }
.hz img { display: block; width: 100%; height: auto; transform-origin: 50% 70%; animation: peek 8s cubic-bezier(0.45, 0, 0.25, 1) infinite; animation-delay: var(--look); }
/* 고개 돌리기: 옆으로 돌아보며 살짝 기울이고, 잠시 머문 뒤 정면으로 */
@keyframes peek {
  0%, 4% { transform: none; }
  10% { transform: rotateY(calc(var(--dir) * 26deg)) translateX(calc(var(--dir) * 6%)) rotate(calc(var(--dir) * 6deg)); }
  13% { transform: rotateY(calc(var(--dir) * 22deg)) translateX(calc(var(--dir) * 5%)) rotate(calc(var(--dir) * 4deg)); }
  24% { transform: rotateY(calc(var(--dir) * 24deg)) translateX(calc(var(--dir) * 5.5%)) rotate(calc(var(--dir) * 5deg)) translateY(-2%); }
  32%, 100% { transform: none; }
}
.hz:hover .fl { animation: hzJump 0.6s cubic-bezier(0.33, 0, 0.3, 1); }
@keyframes hzJump { 0%, 100% { transform: translateY(0) scale(1); } 15% { transform: scale(1.06, 0.94); } 45% { transform: translateY(-16%) scale(0.97, 1.04); } 75% { transform: translateY(0) scale(1.05, 0.95); } }
@media (prefers-reduced-motion: reduce) { .hz, .hz .fl, .hz img { animation: none !important; } }
.nav { position: sticky; top: 0; background: linear-gradient(var(--ink) 60%, rgba(28, 26, 16, 0)); }
/* ---------- 스크롤 스토리 (Belife와 같은 방식) ---------- */
.story { --gap: clamp(24px, 4vw, 72px); position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: var(--gap); }
.story > .visual { grid-column: 1; grid-row: 1; transform: translateX(calc(var(--vx, 0) * (100% + var(--gap)))); }
.story > .steps { grid-column: 1 / -1; grid-row: 1; }
.visual { position: sticky; top: 88px; height: calc(100vh - 88px); height: calc(100svh - 88px); display: grid; place-items: center; pointer-events: none; }
.stage { position: relative; width: min(100%, calc((100vh - 88px) * 0.9), 640px); aspect-ratio: 1; perspective: 900px; }
.tilt { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1); }
.float { position: absolute; inset: 0; animation: float 7s ease-in-out infinite; }
@keyframes float { 0%, 100% { transform: translateY(-1.2%); } 50% { transform: translateY(1.2%); } }
.art { position: absolute; inset: 0; opacity: 0; will-change: transform, opacity; }
.art:first-child { opacity: 1; }
.glow { position: absolute; left: 12%; right: 12%; bottom: 2%; height: 14%; background: radial-gradient(closest-side, rgba(255, 234, 0, 0.16), rgba(255, 234, 0, 0)); filter: blur(8px); }
.steps { list-style: none; margin: 0; padding: 0; }
.step { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; justify-content: center; padding-block: 12vh; padding-left: calc(50% + var(--gap) / 2); will-change: opacity, transform; }
.step.alt { padding-left: 0; padding-right: calc(50% + var(--gap) / 2); }
.step h2 { margin: 0 0 clamp(20px, 2.4vw, 32px); font: 700 clamp(1.9rem, 3.3vw, 3.2rem)/1.3 var(--kr); letter-spacing: -0.05em; word-break: keep-all; }
.step p { margin: 0; max-width: 24em; font: 400 clamp(1.08rem, 1.45vw, 1.32rem)/1.8 var(--kr); letter-spacing: -0.02em; word-break: keep-all; color: rgba(255, 255, 255, 0.78); }
.sm-shadow { position: absolute; left: 14%; right: 14%; bottom: -5%; height: 12%; border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 170, 0, 0.3), rgba(255, 170, 0, 0)); filter: blur(6px); }

/* 첫 단락: 회색 톱니바퀴가 기계적으로 뚝뚝 돌고, 스마일은 한숨 쉬듯 축 처진다 */
.sceneA .gear { position: absolute; height: auto; }
.sceneA .g1 { left: 2%; top: 8%; width: 46%; animation: tickCW 24s steps(48) infinite; }
.sceneA .g2 { left: 42%; top: 1%; width: 31%; animation: tickCCW 16s steps(32) infinite; }
.sceneA .g3 { left: 30%; top: 47%; width: 22%; animation: tickCCW 11s steps(22) infinite; }
@keyframes tickCW { to { transform: rotate(360deg); } }
@keyframes tickCCW { to { transform: rotate(-360deg); } }
.sceneA .sad-wrap { position: absolute; right: 3%; bottom: 7%; width: 42%; aspect-ratio: 557 / 546; }
.sceneA .sad { position: absolute; inset: 0; width: 100%; height: 100%; transform-origin: 50% 95%; animation: sigh 6s cubic-bezier(0.45, 0, 0.3, 1) infinite; }
@keyframes sigh {
  0%, 12% { transform: none; }
  22% { transform: translateY(-2%) scale(0.99, 1.02); }
  45% { transform: translateY(3%) rotate(-4deg) scale(1.03, 0.96); }
  70% { transform: translateY(3%) rotate(-4deg) scale(1.03, 0.96); }
  90%, 100% { transform: none; }
}

/* 둘째 단락: 노트북 화면이 은은하게 빛나고, 스마일이 노트북 쪽으로 기울며 신나게 튄다 */
.sceneB .lap-wrap { position: absolute; left: 0; bottom: 12%; width: 62%; aspect-ratio: 854 / 764; }
.sceneB .lap { position: absolute; inset: 0; width: 100%; height: 100%; }
.sceneB .screen-glow { position: absolute; left: 64%; top: 39%; width: 70%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 234, 0, 0.35), rgba(255, 234, 0, 0)); mix-blend-mode: screen; animation: glowPulse 2.6s ease-in-out infinite; }
@keyframes glowPulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
.sceneB .joy-wrap { position: absolute; right: 2%; bottom: 16%; width: 38%; aspect-ratio: 580 / 591; transform: rotate(-8deg); }
.sceneB .joy { position: absolute; inset: 0; width: 100%; height: 100%; transform-origin: 50% 100%; animation: hop 1.5s cubic-bezier(0.33, 0, 0.3, 1) infinite; }
@keyframes hop {
  0%   { transform: translateY(0) scale(1.05, 0.95); }
  12%  { transform: translateY(0) scale(0.97, 1.03); }
  40%  { transform: translateY(-13%) rotate(-4deg); }
  62%  { transform: translateY(0); }
  70%  { transform: translateY(0) scale(1.06, 0.94); }
  100% { transform: translateY(0) scale(1.05, 0.95); }
}

@media (max-width: 600px) {
  .story { grid-template-columns: 1fr; }
  .story > .visual { grid-row: 1; transform: none; top: 64px; height: 50vh; height: 50svh; z-index: 0; }
  .story > .steps { grid-column: 1; grid-row: 2; position: relative; z-index: 1; margin-top: -50vh; margin-top: -50svh; }
  .stage { width: min(84vw, 46vh); }
  .step, .step.alt { padding: 0 0 14vh; min-height: 90vh; min-height: 90svh; justify-content: flex-end; }
  .step h2, .step p { text-shadow: 0 0 24px var(--ink), 0 0 2px var(--ink); }
}
@media (prefers-reduced-motion: reduce) { .float, .sceneA .gear, .sceneA .sad, .sceneB .joy, .sceneB .screen-glow { animation: none; } }
/* ---------- 야구카드: 마우스를 따라 기울며 반짝이고, 누르면 뒤집혀 기록이 보인다 ---------- */
.card-li { grid-column: 5 / span 4; display: flex; flex-direction: column; align-items: center; }
@media (max-width: 1000px) { .card-li { grid-column: 4 / span 6; } }
@media (max-width: 560px) { .card-li { grid-column: 1 / -1; } }
.bcard { display: block; width: 100%; max-width: 380px; padding: 0; border: 0; background: none; color: inherit; font: inherit; text-align: left; perspective: 1100px; }
.bc-inner { position: relative; display: block; aspect-ratio: 5 / 7; transform-style: preserve-3d; transition: transform 0.7s cubic-bezier(0.3, 1.3, 0.5, 1); transform: rotateY(var(--ry, 0deg)) rotateX(var(--rx, 0deg)); }
.bcard[aria-pressed="true"] .bc-inner { transform: rotateY(calc(180deg + var(--ry, 0deg))) rotateX(var(--rx, 0deg)); }
.bc-face { position: absolute; inset: 0; display: block; border-radius: 16px; overflow: hidden; backface-visibility: hidden; -webkit-backface-visibility: hidden; border: 9px solid var(--zing); box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45), inset 0 0 0 2px var(--ink); }
.bc-front .bc-art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.bc-no { position: absolute; left: 12px; top: 12px; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--zing); border: 2px solid var(--zing); font: 800 1.05rem/1 "Bricolage Grotesque", var(--latin); letter-spacing: -0.03em; }
.bc-plate { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 18px 16px; display: flex; flex-direction: column; gap: 2px; background: linear-gradient(rgba(28, 26, 16, 0), var(--ink) 38%); }
.bc-plate b, .bc-head b { font: 800 clamp(2.4rem, 4vw, 3.2rem)/0.95 "Bricolage Grotesque", var(--latin); font-variation-settings: "wdth" 85; letter-spacing: -0.04em; color: var(--zing); }
.bc-plate small, .bc-head small { font: 500 0.92rem/1.4 var(--latin); color: #FFFFFF; }
/* 빛 반사: 마우스 위치를 따라 흰빛과 노란빛 띠가 지나간다 */
.bc-holo { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.3s ease; mix-blend-mode: soft-light;
  background: linear-gradient(115deg, rgba(255, 255, 255, 0) 25%, rgba(255, 255, 255, 0.75) 42%, rgba(255, 234, 0, 0.6) 50%, rgba(255, 255, 255, 0.5) 58%, rgba(255, 255, 255, 0) 75%) var(--mx, 50%) var(--my, 50%) / 250% 250% no-repeat; }
.bcard:hover .bc-holo, .bcard:focus-visible .bc-holo { opacity: 1; }
.bc-back { transform: rotateY(180deg); background: var(--ink); display: flex; flex-direction: column; padding: 22px 20px; }
.bc-head { display: flex; flex-direction: column; gap: 4px; padding-bottom: 16px; border-bottom: 2px solid var(--zing); }
.bc-stats { flex: 1; display: flex; flex-direction: column; justify-content: space-around; }
.bc-row { display: grid; grid-template-columns: auto 1fr; column-gap: 12px; align-items: baseline; padding-block: 10px; border-bottom: 1px solid rgba(255, 234, 0, 0.25); }
.bc-row em { grid-row: span 2; font: 600 0.78rem/1.6 var(--latin); font-style: normal; color: var(--zing); width: 6.2em; }
.bc-row strong { font: 800 2.2rem/1 "Bricolage Grotesque", var(--latin); letter-spacing: -0.03em; color: #FFFFFF; }
.bc-row strong.kr { font: 700 1.05rem/1.45 var(--kr); letter-spacing: -0.03em; }
.bc-row strong sup { font-size: 0.55em; color: var(--zing); vertical-align: top; margin-left: 1px; }
.bc-row > span.kr { font: 400 0.88rem/1.5 var(--kr); color: rgba(255, 255, 255, 0.65); }
.bc-foot { height: 26px; margin-top: 10px; background: url("assets/favicon.svg") left center / 26px 26px no-repeat; }
.bc-hint { margin: 14px 0 0; font: 400 0.88rem/1.5 var(--kr); color: var(--graphite); }
/* 뭉치: 앞면 오른쪽 아래 이름판 위에 앉아 있다 */
.bc-dog { position: absolute; right: 4%; bottom: 3%; width: 34%; height: auto; transform-origin: 50% 100%; animation: dogWag 3.4s ease-in-out infinite; }
@keyframes dogWag { 0%, 100% { transform: rotate(0deg); } 20% { transform: rotate(-4deg) translateY(-3%); } 40% { transform: rotate(3deg); } 60% { transform: rotate(0deg); } }
.bc-happy { position: relative; padding-right: 64px; }
.bc-dog-mini { position: absolute; right: 0; top: 50%; width: 56px; height: auto; transform: translateY(-50%); }
/* 수상 이력: 광고제 이름 배지 */
.bc-awards { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-start; gap: 12px 18px; margin-top: 14px; }
.bc-awards img { display: block; height: 17px; width: auto; opacity: 0.9; }
.bc-awards img.tall { height: 34px; }
.bc-awards img.yt { height: 24px; }
.bc-awards img.mid { height: 22px; }
/* 넘어갈 듯 말 듯: 카드가 뒤집히려다 멈칫하고 되돌아온다. 마우스를 올리거나 뒤집으면 멈춘다 */
@property --tease { syntax: '<angle>'; inherits: true; initial-value: 0deg; }
.bc-inner { transform: rotateY(calc(var(--ry, 0deg) + var(--tease))) rotateX(var(--rx, 0deg)); animation: tease 2.1s cubic-bezier(0.45, 0, 0.3, 1) 1s infinite; }
.bcard[aria-pressed="true"] .bc-inner { transform: rotateY(calc(180deg + var(--ry, 0deg))) rotateX(var(--rx, 0deg)); }
.bcard:hover .bc-inner, .bcard:focus-visible .bc-inner, .bcard[aria-pressed="true"] .bc-inner { animation: none; }
@keyframes tease {
  0%, 24% { --tease: 0deg; }
  45% { --tease: 18deg; }
  54% { --tease: 20deg; }
  71% { --tease: -4deg; }
  84% { --tease: 1.5deg; }
  93%, 100% { --tease: 0deg; }
}
@media (prefers-reduced-motion: reduce) { .bc-inner { transition: none; animation: none; } .bc-dog { animation: none; } }
</style>
</head>
<body data-page="happiz" class="dark">
<main>
  <section class="wrap block grid mission">
    <p class="display-kr">Happiz가 행복하게 일하는 것은<br>BeHappy의 중요한 미션입니다.</p>
    <p class="lead">행복하게 일하며 행복한 결과를 만들어내는 Happiz를 소개합니다.</p>
  </section>

  <section class="wrap block">
    <ul class="grid people">
      <li class="person card-li">
        <button class="bcard" type="button" aria-pressed="false" aria-label="TJ 카드. 누르면 뒷면의 기록을 볼 수 있어요">
          <span class="bc-inner">
            <span class="bc-face bc-front">
              <img class="bc-art" src="assets/happiz/tj-card.webp" alt="달려가는 포즈의 TJ 3D 캐릭터">
              <span class="bc-no">01</span>
              <span class="bc-plate"><b>TJ</b><small>Founder, Campaign Director</small></span>
              <span class="bc-holo" aria-hidden="true"></span>
            </span>
            <span class="bc-face bc-back">
              <span class="bc-head"><b>TJ</b><small>Founder, Campaign Director</small></span>
              <span class="bc-stats">
                <span class="bc-row bc-happy"><em>Happy</em><strong class="kr">아내와 뭉치와<br>산책하는 것</strong><img class="bc-dog-mini" src="assets/happiz/mungchi.webp" alt=""></span>
                <span class="bc-row"><em>Campaigns</em><strong>200<sup>+</sup></strong><span class="kr">20년간 만든 캠페인</span></span>
                <span class="bc-row"><em>Awards</em><strong>50<sup>+</sup></strong><span class="kr">국내외 광고제 수상</span>
                  <span class="bc-awards"><img src="assets/awards/clios.png" alt="Clio Awards"><img class="tall" src="assets/awards/nyf.png" alt="New York Festivals"><img src="assets/awards/adfest.png" alt="ADFEST"><img class="tall" src="assets/awards/adkor.png" alt="대한민국광고대상"><img class="yt" src="assets/awards/youtube-works.png" alt="YouTube Works Awards Korea"><img class="mid" src="assets/awards/spikes-asia.png" alt="Spikes Asia"></span></span>
              </span>
              <span class="bc-foot" aria-hidden="true"></span>
            </span>
          </span>
        </button>
      </li>
    </ul>
  </section>
</main>
<script src="assets/site.js"></script>
<script>
/* 야구카드: 기울기, 빛 반사, 뒤집기 */
(function () {
  var card = document.querySelector('.bcard'); if (!card) { return; }
  var inner = card.querySelector('.bc-inner');
  var reduce = false; try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
  card.addEventListener('click', function () { inner.style.transition = ''; card.setAttribute('aria-pressed', card.getAttribute('aria-pressed') === 'true' ? 'false' : 'true'); });
  if (reduce) { return; }
  card.addEventListener('pointermove', function (e) {
    var r = card.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    inner.style.transition = 'transform 0.12s ease-out';
    inner.style.setProperty('--ry', ((x - 0.5) * 18).toFixed(2) + 'deg');
    inner.style.setProperty('--rx', ((0.5 - y) * 14).toFixed(2) + 'deg');
    card.style.setProperty('--mx', (x * 100).toFixed(1) + '%');
    card.style.setProperty('--my', (y * 100).toFixed(1) + '%');
  });
  card.addEventListener('pointerleave', function () {
    inner.style.transition = '';
    inner.style.setProperty('--ry', '0deg'); inner.style.setProperty('--rx', '0deg');
  });
})();
</script>
</body>
</html>
